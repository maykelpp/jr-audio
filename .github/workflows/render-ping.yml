name: JR Audio · Render keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jr-audio-render-ping
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake and check Render API
        run: |
          set -e
          URL="https://jr-audio-control-s8ap.onrender.com/healthz"
          for attempt in 1 2 3; do
            code="$(curl --silent --show-error --location --max-time 90 --output /tmp/health.json --write-out '%{http_code}' "$URL" || true)"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Ping $attempt returned HTTP ${code:-no-response}; retrying..."
            sleep 10
          done
          echo "Render API did not return HTTP 200."
          exit 1
